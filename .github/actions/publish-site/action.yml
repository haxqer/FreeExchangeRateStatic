name: Publish complete exchange rate site
description: Publish latest rates and all archived snapshots, recovering failed deployments.

inputs:
  force-deploy:
    description: Deploy even when the public files match.
    default: 'false'

outputs:
  page_url:
    description: URL of the deployed GitHub Pages site.
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: Check whether the public site needs an update
      id: site
      if: inputs.force-deploy != 'true'
      shell: bash
      env:
        SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      run: python3 scripts/check_site.py --site-url "$SITE_URL" >> "$GITHUB_OUTPUT"
    - name: Prepare public files
      if: inputs.force-deploy == 'true' || steps.site.outputs.deploy == 'true'
      shell: bash
      run: |
        mkdir -p _site
        cp latest.json index.html _site/
        if [ -d history ]; then
          cp -R history _site/
        fi
        touch _site/.nojekyll
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      if: inputs.force-deploy == 'true' || steps.site.outputs.deploy == 'true'
      with:
        path: _site
        retention-days: 1
    - name: Deploy to GitHub Pages
      id: deployment
      if: inputs.force-deploy == 'true' || steps.site.outputs.deploy == 'true'
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
