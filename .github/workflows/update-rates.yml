name: Update exchange rates

on:
  schedule:
    # Retry every 20 minutes so one missed trigger does not lose the whole hour.
    # Offset from archive-rates.yml and the busy start of the hour; times are UTC.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-rates.yml'
      - '.github/actions/publish-site/**'
      - 'scripts/update_rates.py'
      - 'scripts/check_site.py'
      - 'tests/test_update_rates.py'
      - 'tests/test_check_site.py'
      - 'index.html'
      - 'latest.json'
  pull_request:
    paths:
      - '.github/workflows/update-rates.yml'
      - '.github/actions/publish-site/**'
      - 'scripts/update_rates.py'
      - 'scripts/check_site.py'
      - 'tests/test_update_rates.py'
      - 'tests/test_check_site.py'

permissions:
  contents: read

concurrency:
  # Shared with archive-rates.yml to serialize main commits and complete-site deployments.
  group: exchange-rates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s tests -v

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      # Ubuntu 24.04 already includes Python 3.12; no runtime or dependencies to install.
      - name: Test code changes
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s tests -v
      - name: Fetch and validate rates
        run: python3 scripts/update_rates.py
      - name: Commit updated snapshot
        run: |
          git add latest.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update exchange rate snapshot'
            git push origin HEAD:main
          fi
      - name: Publish complete site
        id: deployment
        uses: ./.github/actions/publish-site
        with:
          force-deploy: ${{ github.event_name == 'workflow_dispatch' }}
