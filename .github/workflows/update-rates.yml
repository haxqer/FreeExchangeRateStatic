name: Update exchange rates

on:
  schedule:
    # Run away from the busy start of the hour; GitHub schedules use UTC.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-rates.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'latest.json'
  pull_request:
    paths:
      - '.github/workflows/update-rates.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: exchange-rates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s tests -v

  update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      # Ubuntu 24.04 already includes Python 3.12; no runtime or dependencies to install.
      - name: Test code changes
        if: github.event_name == 'push'
        run: python3 -m unittest discover -s tests -v
      - name: Fetch and validate rates
        run: python3 scripts/update_rates.py
      - name: Commit updated snapshot
        run: |
          git add latest.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update exchange rate snapshot'
            git push origin HEAD:main
          fi
      - name: Check whether the public site needs an update
        id: site
        if: github.event_name != 'workflow_dispatch'
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 scripts/check_site.py --site-url "$SITE_URL" >> "$GITHUB_OUTPUT"
      - name: Prepare public files
        if: github.event_name == 'workflow_dispatch' || steps.site.outputs.deploy == 'true'
        run: |
          mkdir -p _site
          cp latest.json index.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'workflow_dispatch' || steps.site.outputs.deploy == 'true'
        with:
          path: _site
          retention-days: 1
      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'workflow_dispatch' || steps.site.outputs.deploy == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
