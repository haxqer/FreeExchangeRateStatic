name: Collect and publish exchange rates

on:
  # Manual runs only; GitHub no longer starts this workflow automatically.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # Serialize collection, commits, deployments, and the manual compatibility entry.
  group: exchange-rates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Record trigger details
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf 'Event: %s\n\n' "$EVENT_NAME"
            printf 'Job started (UTC): %s\n\nRun: %s\n' "$(date -u +%FT%TZ)" "$RUN_URL"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      # Ubuntu 24.04 already includes Python 3.12; no runtime or dependencies to install.
      - name: Collect or recover this hour
        id: collection
        run: python3 scripts/collect_rates.py
      - name: Commit latest and hourly history together
        # Keep a collected hour even when updating latest or rebuilding indexes failed.
        if: ${{ !cancelled() && (steps.collection.outcome == 'success' || steps.collection.outcome == 'failure') }}
        run: |
          git add latest.json history/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Collect hourly exchange rate snapshot'
            git push origin HEAD:main
          fi
      - name: Publish complete site
        id: deployment
        uses: ./.github/actions/publish-site
        with:
          force-deploy: ${{ github.event_name == 'workflow_dispatch' }}
